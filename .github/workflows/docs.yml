name: docs

# Builds the MkDocs site with --strict as a check. Hosting is Cloudflare
# Workers Builds connected to this repository (build: pip install
# mkdocs-material && mkdocs build; deploy: npx wrangler deploy, see
# wrangler.jsonc), so no deploy step and no secrets live here.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet mkdocs-material
      - run: mkdocs build --strict --site-dir site
