# Packaging for the desktop wrapper: `bun run package` (see package.json).
# The .app and the .dmg land in dist/mac-arm64/; the icon is rendered first
# by `bun run icon` from assets/logo.svg. Ad-hoc signed by the builder's
# default; notarisation is out of scope.
appId: sh.weevil.holophyte.console
productName: Holophyte
directories:
  output: dist
  buildResources: dist
files:
  - main.cjs
  - dist/main.cjs
  - dist/icon.png
  - package.json
# The tray's template icon pair lives in the repository's assets/ and is
# copied next to the app bundle's resources so main.ts finds it packaged.
extraResources:
  - from: ../../assets/menubar-template@1x.png
    to: assets/menubar-template@1x.png
  - from: ../../assets/menubar-template@2x.png
    to: assets/menubar-template@2x.png
mac:
  target:
    - dmg
    - dir
  icon: dist/icon.png
  category: public.app-category.developer-tools
