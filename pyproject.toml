[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holophyte"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tomlkit==0.15.1", "mcp==2.3.0", "claude-agent-sdk==0.2.167"]

[project.scripts]
holo = "holophyte.holo.cli:main"

[tool.setuptools.packages.find]
include = ["holophyte*", "store*"]
